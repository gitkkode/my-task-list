<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Workspace - SCIMAX Publication Workspace</title>
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="light-theme">
  
  <!-- Main App Container -->
  <div class="app-container">
    
    <!-- SCIMAX Header -->
    <header class="app-header">
      <div class="app-header__glow" aria-hidden="true"></div>
      <div class="app-header__content">
        <div class="app-header__left">
          <h1>Task Workspace</h1>
          <p class="app-header__subtitle">SCIMAX Pubs System</p>
        </div>
        <div class="app-header__right">
          <div class="app-header__actions">
            <div class="date-display">
              <i data-lucide="calendar"></i>
              <span id="currentDateStr">Saturday, Aug 15, 2026</span>
            </div>
            <button class="sci-btn sci-btn--primary" id="openCreateModalBtn">
              <i data-lucide="plus-circle"></i>
              <span>New Task</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Stats Summary Banner -->

      <div class="stat-card">
        <div class="stat-icon stat-orange">

    <!-- Toolbar: Search, Filters & View Toggle -->
    <section class="toolbar-section">
      <div class="toolbar-top">
        <!-- SCIMAX Search Box (.sci-search) -->
        <div class="sci-search">
          <i data-lucide="search" class="sci-search__icon"></i>
          <input type="text" id="searchInput" class="sci-search__input" placeholder="Search tasks by title, code (e.g. MOB-104), project or type..." />
          <span class="kbd-shortcut"><kbd>⌘</kbd><kbd>K</kbd></span>
          <button class="clear-search-btn" id="clearSearchBtn" title="Clear search">
            <i data-lucide="x"></i>
          </button>
        </div>

        <!-- Right Controls: Custom Sort & View Switch -->
        <div class="toolbar-actions">
          <div class="sci-custom-select-wrap" id="sortSelectWrap" style="min-width: 210px;">
            <button type="button" class="sci-custom-select-trigger" id="sortSelectTrigger">
              <i data-lucide="arrow-up-down" class="sci-custom-select-trigger__left-icon"></i>
              <span class="sci-custom-select-trigger__label" id="sortSelectLabel">Due Date: Soonest First</span>
              <i data-lucide="chevron-down" class="sci-custom-select-trigger__caret"></i>
            </button>
            <div class="sci-custom-select-panel hidden" id="sortSelectPanel">
              <button type="button" class="sci-custom-select-option is-selected" data-value="endDateAsc">
                <span>Due Date: Soonest First</span>
                <i data-lucide="check" class="sci-custom-select-option__check"></i>
              </button>
              <button type="button" class="sci-custom-select-option" data-value="startDateAsc">
                <span>Start Date: Earliest First</span>
              </button>
              <button type="button" class="sci-custom-select-option" data-value="titleAsc">
                <span>Task Title: A-Z</span>
              </button>
              <button type="button" class="sci-custom-select-option" data-value="idAsc">
                <span>Task ID: Ascending</span>
              </button>
            </div>
          </div>

          <div class="view-toggle">
            <button class="toggle-btn active" id="viewGridBtn" title="Card Grid View">
              <i data-lucide="layout-grid"></i>
            </button>
            <button class="toggle-btn" id="viewTableBtn" title="Compact Table View">
              <i data-lucide="list"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Filter Controls Bar -->
      <div class="filter-controls">
        <!-- Status Filter Tabs (.sci-chip-tab) -->
        <div class="status-tabs" id="statusTabs">
          <button class="sci-chip-tab active" data-status="all">
            <span>All Active</span>
            <span class="tab-count" id="countAll">0</span>
          </button>
          <button class="sci-chip-tab" data-status="In-Progress">
            <span class="status-dot dot-in-progress"></span>
            <span>In-Progress</span>
            <span class="tab-count" id="countInProgress">0</span>
          </button>
          <button class="sci-chip-tab" data-status="Planned">
            <span class="status-dot dot-planned"></span>
            <span>Planned</span>
            <span class="tab-count" id="countPlanned">0</span>
          </button>
          <button class="sci-chip-tab" data-status="favourite">
            <i data-lucide="star" class="tab-star-icon"></i>
            <span>Favourites</span>
            <span class="tab-count" id="countFavourites">0</span>
          </button>
        </div>

        <div class="dropdown-filters">
          <!-- Custom Project Selector Filter -->
          <div class="sci-custom-select-wrap" id="projectFilterWrap" style="min-width: 180px;">
            <button type="button" class="sci-custom-select-trigger" id="projectFilterTrigger">
              <i data-lucide="folder" class="sci-custom-select-trigger__left-icon"></i>
              <span class="sci-custom-select-trigger__label" id="projectFilterLabel">All Projects</span>
              <i data-lucide="chevron-down" class="sci-custom-select-trigger__caret"></i>
            </button>
            <div class="sci-custom-select-panel hidden" id="projectFilterPanel">
              <!-- Rendered dynamically by JS -->
            </div>
          </div>

          <!-- Custom Task Type Selector Filter -->
          <div class="sci-custom-select-wrap" id="typeFilterWrap" style="min-width: 170px;">
            <button type="button" class="sci-custom-select-trigger" id="typeFilterTrigger">
              <i data-lucide="layers" class="sci-custom-select-trigger__left-icon"></i>
              <span class="sci-custom-select-trigger__label" id="typeFilterLabel">All Task Types</span>
              <i data-lucide="chevron-down" class="sci-custom-select-trigger__caret"></i>
            </button>
            <div class="sci-custom-select-panel hidden" id="typeFilterPanel">
              <button type="button" class="sci-custom-select-option is-selected" data-value="all">
                <span>All Task Types</span>
                <i data-lucide="check" class="sci-custom-select-option__check"></i>
              </button>
              <button type="button" class="sci-custom-select-option" data-value="Feature">
                <span>Feature</span>
              </button>
              <button type="button" class="sci-custom-select-option" data-value="Bug Fix">
                <span>Bug Fix</span>
              </button>
              <button type="button" class="sci-custom-select-option" data-value="Design">
                <span>Design</span>
              </button>
              <button type="button" class="sci-custom-select-option" data-value="Refactor">
                <span>Refactor</span>
              </button>
              <button type="button" class="sci-custom-select-option" data-value="Security">
                <span>Security</span>
              </button>
              <button type="button" class="sci-custom-select-option" data-value="Infrastructure">
                <span>Infrastructure</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Main Content Container: Grid vs Table -->
    <main class="content-area">
      <!-- Grid View Container -->
      <div class="tasks-grid" id="tasksGrid">
        <!-- Dynamic Cards rendered by JS -->
      </div>

      <!-- Table View Container (Hidden by default) -->
      <div class="table-container hidden" id="tableContainer">
        <table class="tasks-table">
          <thead>
            <tr>
              <th style="width: 110px;">Task ID</th>
              <th>Task Details</th>
              <th>Project Information</th>
              <th>Type</th>
              <th>Schedule</th>
              <th>Status</th>
              <th style="width: 120px; text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="tasksTableBody">
            <!-- Dynamic Rows rendered by JS -->
          </tbody>
        </table>
      </div>

      <!-- Empty State View -->
      <div class="empty-state hidden" id="emptyState">
        <div class="empty-icon">
          <i data-lucide="inbox"></i>
        </div>
        <h3>No Tasks Found</h3>
        <p>No active tasks match your current search and filter criteria.</p>
        <button class="sci-btn sci-btn--outline" id="resetFiltersBtn">Reset Filters</button>
      </div>
    </main>

    <!-- Task Details View Container (Hidden by default) -->
    <div id="detailsContainer" class="details-view hidden">
      <!-- Dynamic SCIMAX Task Details View rendered by JS -->
    </div>

  </div>

  <!-- Create / Update Task Modal -->
  <div class="modal-overlay hidden" id="taskModalOverlay">
    <div class="modal-card">
      <!-- SCIMAX Signature 3-Tone Gradient Header -->
      <div class="modal-header">
        <div class="modal-header__glow" aria-hidden="true"></div>
        <div class="modal-header__content">
          <div class="modal-header__left">
            <button type="button" class="modal-back-link" id="closeModalBtn">
              <i data-lucide="arrow-left"></i>
              <span>Back</span>
            </button>
            <h3 id="modalTitle">Create New Task</h3>
            <p class="modal-header__subtitle" id="modalSubtitle">Progressive task configuration</p>
          </div>
          <div class="modal-header-actions">
            <button type="submit" form="taskForm" class="sci-btn sci-btn--primary" id="saveTaskBtn">
              <i data-lucide="check"></i>
              <span id="saveBtnText">Save Task</span>
            </button>
          </div>
        </div>
      </div>

      <form id="taskForm">
        <input type="hidden" id="formTaskId" value="" />

        <div class="form-grid">
          <!-- Task Code / ID -->
          <div class="form-group">
            <label for="formTaskCode">Task ID / Code <span class="required">*</span></label>
            <div class="input-with-icon">
              <i data-lucide="hash"></i>
              <input type="text" id="formTaskCode" required placeholder="e.g. MOB-104" />
            </div>
          </div>

          <!-- Task Title -->
          <div class="form-group full-width">
            <label for="formTaskTitle">Task Title <span class="required">*</span></label>
            <div class="input-with-icon">
              <i data-lucide="type"></i>
              <input type="text" id="formTaskTitle" required placeholder="Describe the task title clearly..." />
            </div>
          </div>

          <!-- Custom Task Type Select -->
          <div class="form-group">
            <label for="formTaskTypeTrigger">Task Type <span class="required">*</span></label>
            <input type="hidden" id="formTaskType" value="Feature" />
            <div class="sci-custom-select-wrap" id="formTaskTypeWrap">
              <button type="button" class="sci-custom-select-trigger" id="formTaskTypeTrigger">
                <i data-lucide="layers" class="sci-custom-select-trigger__left-icon"></i>
                <span class="sci-custom-select-trigger__label" id="formTaskTypeLabel">Feature</span>
                <i data-lucide="chevron-down" class="sci-custom-select-trigger__caret"></i>
              </button>
              <div class="sci-custom-select-panel hidden" id="formTaskTypePanel">
                <button type="button" class="sci-custom-select-option is-selected" data-value="Feature">
                  <span>Feature</span>
                  <i data-lucide="check" class="sci-custom-select-option__check"></i>
                </button>
                <button type="button" class="sci-custom-select-option" data-value="Bug Fix"><span>Bug Fix</span></button>
                <button type="button" class="sci-custom-select-option" data-value="Design"><span>Design</span></button>
                <button type="button" class="sci-custom-select-option" data-value="Refactor"><span>Refactor</span></button>
                <button type="button" class="sci-custom-select-option" data-value="Security"><span>Security</span></button>
                <button type="button" class="sci-custom-select-option" data-value="Infrastructure"><span>Infrastructure</span></button>
                <button type="button" class="sci-custom-select-option" data-value="Documentation"><span>Documentation</span></button>
              </div>
            </div>
          </div>

          <!-- Custom Status Select -->
          <div class="form-group">
            <label for="formStatusTrigger">Initial Status <span class="required">*</span></label>
            <input type="hidden" id="formStatus" value="Planned" />
            <div class="sci-custom-select-wrap" id="formStatusWrap">
              <button type="button" class="sci-custom-select-trigger" id="formStatusTrigger">
                <i data-lucide="activity" class="sci-custom-select-trigger__left-icon"></i>
                <span class="sci-custom-select-trigger__label" id="formStatusLabel">Planned</span>
                <i data-lucide="chevron-down" class="sci-custom-select-trigger__caret"></i>
              </button>
              <div class="sci-custom-select-panel hidden" id="formStatusPanel">
                <button type="button" class="sci-custom-select-option is-selected" data-value="Planned">
                  <span>Planned</span>
                  <i data-lucide="check" class="sci-custom-select-option__check"></i>
                </button>
                <button type="button" class="sci-custom-select-option" data-value="In-Progress">
                  <span>In-Progress</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Project Name -->
          <div class="form-group">
            <label for="formProjectName">Project Name <span class="required">*</span></label>
            <div class="input-with-icon">
              <i data-lucide="folder"></i>
              <input type="text" id="formProjectName" required placeholder="e.g. E-Commerce Mobile App" />
            </div>
          </div>

          <!-- Project Type -->
          <div class="form-group">
            <label for="formProjectType">Project Type <span class="required">*</span></label>
            <div class="input-with-icon">
              <i data-lucide="briefcase"></i>
              <input type="text" id="formProjectType" required placeholder="e.g. iOS & Android App" />
            </div>
          </div>

          <!-- Start Date -->
          <div class="form-group">
            <label for="formStartDate">Start Date <span class="required">*</span></label>
            <div class="input-with-icon">
              <i data-lucide="calendar"></i>
              <input type="date" id="formStartDate" required />
            </div>
          </div>

          <!-- End Date -->
          <div class="form-group">
            <label for="formEndDate">End Date <span class="required">*</span></label>
            <div class="input-with-icon">
              <i data-lucide="calendar"></i>
              <input type="date" id="formEndDate" required />
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main JavaScript File -->
  <script src="app.js"></script>
</body>
</html>
